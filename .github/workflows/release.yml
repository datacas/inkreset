name: Release

on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'InkReset ${{ github.ref_name }}'
          releaseBody: |
            Windows x64 installers are attached below.

            Only tested on an Epson XP-530. Other models are untested: run a read and the safe write test before resetting, at your own risk.

            Resetting a counter does not service the physical waste-ink pad.
          releaseDraft: false
          prerelease: false
