[package]
name = "inkreset-studio"
version = "0.2.0"
description = "InkReset - native USB waste-ink counter service bench"
authors = ["InkReset"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inkreset_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Release builds must embed the frontend; without this Tauri stays in dev mode
# and points the webview at build.devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
